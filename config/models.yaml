# Model stack (spec: Local model stack). Swapping a model is a config change, not a code change.
# Target machine: Apple M1 Pro, 16 GB (docs/decisions/target-mac.md). The LLM is chosen in task 3.17.
llm:
  backend: ollama            # ollama | llamacpp
  base_url: http://localhost:11434
  model: qwen3.5:9b          # placeholder until the 3.17 benchmark
  temperature: 0.0
  timeout_s: 60
  think: false               # Qwen 3.x thinks by default: ~35 s/call vs ~0.5 s
  num_ctx: 8192              # tool prompt is ~2,700 tokens; Ollama's default could truncate
  keep_alive: 30m
sql_fallback_llm: null       # optional larger model for the SQL fallback only (risk mitigation)
embeddings:
  backend: ollama            # `ollama pull bge-m3` (decision 2026-10-07)
  base_url: http://localhost:11434
  model: bge-m3
  batch: 32
reranker:
  model: BAAI/bge-reranker-v2-m3   # sentence-transformers CrossEncoder
  keep: 6
  device: auto
  half_precision: true
retrieval:
  fusion_top_k: 40
agent:
  max_tool_calls: 3
