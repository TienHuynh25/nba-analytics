- id: Q13-p1
  seed_id: Q13
  type: paraphrase
  category: Leaders
  question: Who's the NBA scoring leader this season?
  gold:
    path: stats
    expect: answer
    rule: '"Leads in scoring" and other per-game rankings use the registry''s qualification: 70% of team
      games (58 in an 82-game season), or fewer games if the player''s total divided by that minimum would
      still lead (NBA.com''s league-leader rule).'
    note: 'answer type: Ranked list'
    tool_call:
      tool: get_leaders
      args:
        metric: points_per_game
        limit: 1
        season: 2025-26
    value: *id027
    sql: "WITH s AS (\n  SELECT player_id, player_name, team_name, gp, team_gp, points, points_per_game,\n\
      \    CEIL(0.70 * team_gp) AS min_gp\n  FROM semantic.player_season_stats\n  WHERE season = '2025-26'\
      \ AND season_type = 'Regular Season' AND points_per_game IS NOT NULL\n), top AS (SELECT MAX(points_per_game)\
      \ AS best FROM s WHERE gp >= min_gp),\nq AS (SELECT s.* FROM s, top WHERE s.gp >= s.min_gp OR s.points\
      \ / s.min_gp > top.best),\nr AS (SELECT *, RANK() OVER (ORDER BY points_per_game DESC) AS rank FROM\
      \ q)\nSELECT rank, player_id, player_name, team_name, gp, min_gp, points, points_per_game\nFROM\
      \ r WHERE rank <= 1 ORDER BY rank, player_id"
  source: paraphrase (2.9), LLM-drafted; awaiting review (0.3)
  critical: false
  tags:
  - paraphrase
  - relative-time
  - unreviewed
  split: dev
