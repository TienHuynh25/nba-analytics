  category: Definition
  question: What is true shooting percentage and how is it calculated?
  gold:
    path: knowledge
    expect: answer
    note: 'answer type: Text + formula'
    chunks:
    - true_shooting_pct
    value: &id069
      kind: knowledge
      chunks:
      - true_shooting_pct
      facts:
      - TS% = PTS / (2 × (FGA + 0.44 × FTA))
      - The 0.44 factor estimates how many possessions free throw attempts use
      - counts 2-pointers, 3-pointers and free throws together
