- id: Q48-v1
  seed_id: Q48
  type: entity_variant
  category: Team
  question: Who is the Dubs' leading scorer this season?
  gold:
    path: stats
    expect: answer
    rule: Q14 reads "top 5 rebounders" as rebounds per game. Q20 ranks rookies by points per game. Q48
      ranks Warriors players by points per game over their Warriors stint (for a traded player, only his
      Golden State games). All three use the same games rule as Q13.
    note: 'answer type: Name + number'
    tool_call:
      tool: get_leaders
      args:
        metric: points_per_game
        limit: 1
        season: 2025-26
        team_id: 1610612744
    entities:
      teams:
      - 1610612744
    value: *id019
    sql: "WITH s AS (\n  SELECT player_id, player_name, team_name, gp, team_gp, points, points_per_game,\n\
      \    CEIL(0.70 * team_gp) AS min_gp\n  FROM semantic.player_stint_stats\n  WHERE team_id = 1610612744\
      \ AND season = '2025-26' AND season_type = 'Regular Season'\n    AND points_per_game IS NOT NULL\n\
      ), top AS (SELECT MAX(points_per_game) AS best FROM s WHERE gp >= min_gp),\nq AS (SELECT s.* FROM\
      \ s, top WHERE s.gp >= s.min_gp OR s.points / s.min_gp > top.best),\nr AS (SELECT *, RANK() OVER\
      \ (ORDER BY points_per_game DESC) AS rank FROM q)\nSELECT rank, player_id, player_name, team_name,\
      \ gp, min_gp, points, points_per_game\nFROM r WHERE rank <= 1 ORDER BY rank, player_id"
