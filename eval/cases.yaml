    sql: "WITH g AS (\n  SELECT game_id, home_team_name, away_team_name, home_pts, away_pts FROM semantic.games\n\
      \  WHERE game_date = '2026-04-12' AND season_type = 'Regular Season'\n), b AS (\n  SELECT l.game_id,\
      \ l.player_name, l.pts, l.reb, l.ast,\n    MAX(l.pts) OVER (PARTITION BY l.game_id) AS max_pts,\n\
      \    MAX(l.reb) OVER (PARTITION BY l.game_id) AS max_reb,\n    MAX(l.ast) OVER (PARTITION BY l.game_id)\
      \ AS max_ast\n  FROM semantic.player_game_log l JOIN g USING (game_id)\n)\nSELECT g.game_id, g.home_team_name,\
      \ g.home_pts, g.away_team_name, g.away_pts,\n  MAX(b.max_pts) AS pts,\n  STRING_AGG(b.player_name,\
      \ ' / ' ORDER BY b.player_name) FILTER (WHERE b.pts = b.max_pts)\n    AS pts_leaders,\n  MAX(b.max_reb)\
      \ AS reb,\n  STRING_AGG(b.player_name, ' / ' ORDER BY b.player_name) FILTER (WHERE b.reb = b.max_reb)\n\
      \    AS reb_leaders,\n  MAX(b.max_ast) AS ast,\n  STRING_AGG(b.player_name, ' / ' ORDER BY b.player_name)\
      \ FILTER (WHERE b.ast = b.max_ast)\n    AS ast_leaders\nFROM g JOIN b USING (game_id)\nGROUP BY\
      \ g.game_id, g.home_team_name, g.home_pts, g.away_team_name, g.away_pts\nORDER BY g.game_id"
