        source:
          snapshot: eval_2025_26_rs
          manifest_sha256: 6305f368c785e28575769b5c38a3bedb24f13a756bf3805fd496db44b45301e8
          registry_version: 0.4.0
          block: M01.1
      sql: "WITH s AS (\n  SELECT player_id, player_name, team_name, gp, team_gp, points, points_per_game,\n\
        \    CEIL(0.70 * team_gp) AS min_gp\n  FROM semantic.player_season_stats\n  WHERE season = '2025-26'\
        \ AND season_type = 'Regular Season' AND points_per_game IS NOT NULL\n), top AS (SELECT MAX(points_per_game)\
        \ AS best FROM s WHERE gp >= min_gp),\nq AS (SELECT s.* FROM s, top WHERE s.gp >= s.min_gp OR\
        \ s.points / s.min_gp > top.best),\nr AS (SELECT *, RANK() OVER (ORDER BY points_per_game DESC)\
        \ AS rank FROM q)\nSELECT rank, player_id, player_name, team_name, gp, min_gp, points, points_per_game\n\
        FROM r WHERE rank <= 1 ORDER BY rank, player_id"
    reuses: []
