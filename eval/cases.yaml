      ), top AS (SELECT MAX(points_per_game) AS best FROM s WHERE gp >= min_gp),\nq AS (SELECT s.* FROM\
      \ s, top WHERE s.gp >= s.min_gp OR s.points / s.min_gp > top.best),\nr AS (SELECT *, RANK() OVER\
      \ (ORDER BY points_per_game DESC) AS rank FROM q)\nSELECT rank, player_id, player_name, team_name,\
      \ gp, min_gp, points, points_per_game\nFROM r WHERE rank <= 1 ORDER BY rank, player_id"
