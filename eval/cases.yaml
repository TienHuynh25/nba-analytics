          block: M08.1
      sql: "WITH s AS (\n  SELECT player_id, player_name, team_name, gp, team_gp, rebounds, rebounds_per_game,\n\
        \    CEIL(0.70 * team_gp) AS min_gp\n  FROM semantic.player_season_stats\n  WHERE season = '2025-26'\
        \ AND season_type = 'Regular Season' AND rebounds_per_game IS NOT NULL\n), top AS (SELECT MAX(rebounds_per_game)\
        \ AS best FROM s WHERE gp >= min_gp),\nq AS (SELECT s.* FROM s, top WHERE s.gp >= s.min_gp OR\
        \ s.rebounds / s.min_gp > top.best),\nr AS (SELECT *, RANK() OVER (ORDER BY rebounds_per_game\
        \ DESC) AS rank FROM q)\nSELECT rank, player_id, player_name, team_name, gp, min_gp, rebounds,\
        \ rebounds_per_game\nFROM r WHERE rank <= 1 ORDER BY rank, player_id"
