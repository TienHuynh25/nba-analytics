- id: Q50-v1
  seed_id: Q50
  type: entity_variant
  category: Team
  question: What is the NYK longest winning streak this season?
  gold:
    path: stats
    expect: answer
    note: 'answer type: Number'
    tool_call:
      tool: get_games
      args:
        team_ids:
        - 1610612752
        season: 2025-26
        streak: win
    entities:
      teams:
      - 1610612752
    value: *id020
    sql: "WITH g AS (\n  SELECT game_id, game_date,\n    CASE WHEN winner_team_id = 1610612752 THEN 1\
      \ ELSE 0 END AS w\n  FROM semantic.games\n  WHERE season = '2025-26' AND season_type = 'Regular\
      \ Season'\n    AND 1610612752 IN (home_team_id, away_team_id)\n), r AS (\n  SELECT game_date, w,\n\
      \    SUM(1 - w) OVER (ORDER BY game_date, game_id ROWS UNBOUNDED PRECEDING) AS losses_before\n \
      \ FROM g\n), runs AS (\n  SELECT SUM(w) AS streak, MIN(game_date) AS first_win, MAX(game_date) AS\
      \ last_win\n  FROM r WHERE w = 1 GROUP BY losses_before\n)\nSELECT 1610612752 AS team_id, streak,\
      \ first_win, last_win FROM runs\nWHERE streak = (SELECT MAX(streak) FROM runs) ORDER BY first_win"
