# Pinned evaluation snapshots (task 2.1). Pinned snapshots are never made current and never
# pruned (ingest/snapshots.publish refuses them). Paths are relative to the repo root.
# Built with: make refresh AS_OF=2026-04-12 SNAPSHOT_ID=eval_2025_26_rs (from the raw cache)
# manifest_sha256 is sha256 of manifest.json, whose "checksums" cover the database and every
# shots Parquet file. tests/test_eval_snapshots.py checks it against the built snapshot.
# Rebuilt 2026-10-12 (T-2.1 rework): the database holds only marts, seeds and semantic, copied
# into a fresh file; the first build (staging leaked post-cutoff rows) is in data/quarantine/.
# Rebuilt again 2026-10-12 (T-DET, DEF-021): deterministic marts (tie-breaks, ORDER BY ALL) and
# sorted shots. Two full builds give identical table content (row order included) and identical
# shot Parquet bytes; the .duckdb file bytes differ per build (DuckDB storage layout), so
# db_sha256 pins this file only. Earlier builds are in data/quarantine/.
# git_sha is HEAD at build time; the copy step and T-DET changes were not yet committed then.
eval:
  snapshot_id: eval_2025_26_rs
  path: data/snapshots/eval_2025_26_rs
  db: data/snapshots/eval_2025_26_rs/eval_2025_26_rs.duckdb
